<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - NexusBank</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body>

    <!-- Back to home -->
    <a href="index.html" style="position: absolute; top: 20px; left: 20px; color: #fff; z-index: 10; font-weight: 500;">
        <i class="fas fa-arrow-left"></i> Back to Home
    </a>

    <div class="auth-container" style="padding-top: 60px; padding-bottom: 60px;">
        <div class="auth-box register-box">
            <div class="auth-header">
                <a href="index.html" class="logo">
                    <i class="fas fa-building-columns"></i>
                    NexusBank
                </a>
                <h2>Open an Account</h2>
                <p>Join the next generation of banking.</p>
            </div>

            <form id="registerForm" novalidate>
                <div class="form-grid">
                    
                    <!-- Personal Info -->
                    <div class="form-group full-width">
                        <h3 style="border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; font-size: 1.2rem;">Personal Information</h3>
                    </div>

                    <div class="form-group">
                        <label for="fullname">Full Name</label>
                        <div class="input-icon">
                            <i class="fas fa-user left-icon"></i>
                            <input type="text" id="fullname" class="form-control" placeholder="John Doe" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="dob">Date of Birth</label>
                        <div class="input-icon">
                            <input type="date" id="dob" class="form-control" style="padding-left: 15px;" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="gender">Gender</label>
                        <select id="gender" class="form-control" required>
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <div class="input-icon">
                            <i class="fas fa-phone left-icon"></i>
                            <input type="tel" id="phone" class="form-control" placeholder="+1 (555) 000-0000" required>
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label for="email">Email Address</label>
                        <div class="input-icon">
                            <i class="fas fa-envelope left-icon"></i>
                            <input type="email" id="email" class="form-control" placeholder="john@example.com" required>
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label for="address">Full Address</label>
                        <div class="input-icon">
                            <i class="fas fa-map-marker-alt left-icon"></i>
                            <input type="text" id="address" class="form-control" placeholder="123 Main St, City, Country" required>
                        </div>
                    </div>

                    <!-- KYC Details -->
                    <div class="form-group full-width" style="margin-top: 20px;">
                        <h3 style="border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; font-size: 1.2rem;">KYC Details</h3>
                    </div>

                    <div class="form-group">
                        <label for="aadhaar">Aadhaar Number (12 Digits)</label>
                        <div class="input-icon">
                            <i class="fas fa-id-card left-icon"></i>
                            <input type="text" id="aadhaar" class="form-control" placeholder="XXXX XXXX XXXX" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="pan">PAN Number</label>
                        <div class="input-icon">
                            <i class="fas fa-id-badge left-icon"></i>
                            <input type="text" id="pan" class="form-control" placeholder="ABCDE1234F" required>
                        </div>
                    </div>

                    <!-- Account Details -->
                    <div class="form-group full-width" style="margin-top: 20px;">
                        <h3 style="border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; font-size: 1.2rem;">Account Configuration</h3>
                    </div>

                    <div class="form-group">
                        <label for="acc_type">Account Type</label>
                        <select id="acc_type" class="form-control" required>
                            <option value="">Select Account Type</option>
                            <option value="Savings">Savings</option>
                            <option value="Current">Current</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="initial_deposit">Initial Deposit Amount ($)</label>
                        <div class="input-icon">
                            <i class="fas fa-dollar-sign left-icon"></i>
                            <input type="number" id="initial_deposit" class="form-control" placeholder="Min 500" min="500" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="reg_password">Password</label>
                        <div class="input-icon">
                            <i class="fas fa-lock left-icon"></i>
                            <input type="password" id="reg_password" class="form-control" placeholder="Create a strong password" required>
                            <i class="fas fa-eye right-icon toggle-password"></i>
                        </div>
                        <div class="password-strength">
                            <div class="strength-bar" id="strengthBar"></div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="reg_confirm_password">Confirm Password</label>
                        <div class="input-icon">
                            <i class="fas fa-lock left-icon"></i>
                            <input type="password" id="reg_confirm_password" class="form-control" placeholder="Confirm your password" required>
                            <i class="fas fa-eye right-icon toggle-password"></i>
                        </div>
                    </div>
                    
                    <div class="form-group full-width btn-group" style="margin-top: 20px;">
                        <button type="reset" class="btn btn-outline">Reset Form</button>
                        <button type="submit" class="btn btn-primary" style="flex: 2;">Register Account</button>
                    </div>
                </div>

            </form>

            <div class="auth-links">
                <p>Already have an account? <a href="login.html">Login Here</a></p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/main.js"></script>
    <script src="js/validation.js"></script>
</body>
</html>
