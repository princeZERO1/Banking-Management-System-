<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer Funds - NexusBank</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body class="dashboard-body">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="dashboard.html" class="logo">
                <i class="fas fa-building-columns"></i>
                NexusBank
            </a>
        </div>
        <nav class="sidebar-menu">
            <ul>
                <li><a href="dashboard.html"><i class="fas fa-house"></i> Dashboard</a></li>
                <li><a href="deposit.html"><i class="fas fa-money-bill-wave"></i> Deposit</a></li>
                <li><a href="withdraw.html"><i class="fas fa-money-bill-transfer"></i> Withdraw</a></li>
                <li><a href="transfer.html" class="active"><i class="fas fa-exchange-alt"></i> Transfer</a></li>
                <li><a href="balance.html"><i class="fas fa-wallet"></i> Balance Inquiry</a></li>
                <li><a href="history.html"><i class="fas fa-list"></i> Transaction History</a></li>
                <li><a href="profile.html"><i class="fas fa-user-gear"></i> Profile</a></li>
            </ul>
        </nav>
        <div class="sidebar-footer">
            <a href="login.html"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Topbar -->
        <header class="topbar">
            <div class="toggle-btn" id="sidebarToggle">
                <i class="fas fa-bars"></i>
            </div>
            <div class="topbar-right">
                <div class="user-profile" onclick="window.location.href='profile.html'">
                    <img src="https://ui-avatars.com/api/?name=John+Doe&background=0D8ABC&color=fff" alt="User">
                    <span>John Doe</span>
                </div>
            </div>
        </header>

        <!-- Content Area -->
        <div class="dashboard-container">
            <div class="page-header">
                <h2>Fund Transfer</h2>
            </div>

            <div class="glass-card" style="max-width: 700px; margin: 0 auto;">
                <form id="transferForm" class="dashboard-action-form" novalidate>
                    
                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label>From Account</label>
                            <div class="input-icon">
                                <i class="fas fa-user left-icon"></i>
                                <input type="text" id="accNumberDisplay" class="form-control" readonly style="background: #f4f4f4;">
                            </div>
                        </div>

                        <div class="form-group full-width">
                            <label for="receiverAccount">To Account (Receiver)</label>
                            <div class="input-icon">
                                <i class="fas fa-user-circle left-icon"></i>
                                <input type="text" id="receiverAccount" class="form-control" placeholder="Enter receiver 12-digit A/C number" required>
                            </div>
                        </div>

                        <div class="form-group full-width">
                            <label for="receiverName">Receiver Name (Verification)</label>
                            <div class="input-icon">
                                <i class="fas fa-id-badge left-icon"></i>
                                <input type="text" id="receiverName" class="form-control" placeholder="Enter receiver's full name" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="transferAmount">Transfer Amount ($)</label>
                            <div class="input-icon">
                                <i class="fas fa-dollar-sign left-icon"></i>
                                <input type="number" id="transferAmount" class="form-control" placeholder="Enter amount" min="1" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="purpose">Purpose of Transfer</label>
                            <select id="purpose" class="form-control" required>
                                <option value="">Select Purpose</option>
                                <option value="Family">Family Support</option>
                                <option value="Payment">Bill Payment</option>
                                <option value="Rent">Rent</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="form-group full-width btn-group" style="margin-top: 20px;">
                            <button type="reset" class="btn btn-outline">Cancel</button>
                            <button type="submit" class="btn btn-primary" style="flex: 2;">Transfer Funds</button>
                        </div>
                    </div>

                </form>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/main.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/validation.js"></script>
</body>
</html>
